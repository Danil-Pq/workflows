name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить зависимости
        run: npm install

      - name: Запустить тесты
        run: npm test

      - name: Собрать приложение
        run: npm run build
